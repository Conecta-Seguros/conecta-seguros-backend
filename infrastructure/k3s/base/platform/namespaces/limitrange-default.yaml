apiVersion: v1
kind: LimitRange
metadata:
  name: resource-constraints
  labels:
    app.kubernetes.io/name: resource-constraints
    app.kubernetes.io/component: governance
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: kustomize
    caicedo.seguros/tier: platform
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
      min:
        cpu: 50m
        memory: 64Mi
      maxLimitRequestRatio:
        cpu: "4"
        memory: "4"

    - type: Pod
      max:
        cpu: "4"
        memory: 8Gi

    - type: PersistentVolumeClaim
      max:
        storage: 100Gi
      min:
        storage: 1Gi