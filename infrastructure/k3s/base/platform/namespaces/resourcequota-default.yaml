apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-resources
  namespace: production
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "20"
    services.loadbalancers: "3"
    count/deployments.apps: "30"
    count/statefulsets.apps: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: object-counts
  namespace: production
spec:
  hard:
    count/configmaps: "50"
    count/secrets: "50"
    count/services: "30"
    count/ingresses.networking.k8s.io: "20"