apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: data-critical
  labels:
    app.kubernetes.io/name: data-critical
    app.kubernetes.io/component: scheduling
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: kustomize
    caicedo.seguros/tier: platform
value: 900000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Critical data services (PostgreSQL, backups). Must not be evicted."

