apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-runner
  labels:
    app.kubernetes.io/name: job-runner
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: cluster-operations
    app.kubernetes.io/managed-by: kustomize
    caicedo.seguros/tier: infrastructure
automountServiceAccountToken: false

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-runner
  labels:
    app.kubernetes.io/name: cleanup-runner
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: cluster-operations
    app.kubernetes.io/managed-by: kustomize
    caicedo.seguros/tier: infrastructure
automountServiceAccountToken: true

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleanup-role
  labels:
    app.kubernetes.io/name: cleanup-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: cluster-operations
    app.kubernetes.io/managed-by: kustomize
    caicedo.seguros/tier: infrastructure
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "delete"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanup-role-binding
  labels:
    app.kubernetes.io/name: cleanup-role-binding
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: cluster-operations
    app.kubernetes.io/managed-by: kustomize
    caicedo.seguros/tier: infrastructure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cleanup-role
subjects:
  - kind: ServiceAccount
    name: cleanup-runner