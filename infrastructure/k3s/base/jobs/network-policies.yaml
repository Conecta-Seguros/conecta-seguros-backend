apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: job-db-access
  labels:
    app.kubernetes.io/name: job-db-access
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: data-management
    app.kubernetes.io/managed-by: kustomize
    conecta.seguros/tier: infrastructure
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backup
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---

