apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-maintenance
  labels:
    app.kubernetes.io/name: postgres-maintenance
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/part-of: data-management
    app.kubernetes.io/managed-by: kustomize
    caicedo.seguros/tier: infrastructure
spec:
  schedule: "0 4 * * 0"
  timeZone: "America/Bogota"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-maintenance
        app.kubernetes.io/component: maintenance
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-maintenance
            app.kubernetes.io/component: maintenance
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: job-runner
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-maintenance
              image: postgres:18
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              envFrom:
                - secretRef:
                    name: caicedo-seguros-secrets
              command:
                - /bin/sh
                - -ec
                - |
                  DB_HOST=$(echo "${POSTGRES_FUSIONAUTH_URL}" | sed 's|jdbc:postgresql://||' | cut -d: -f1)
                  DB_PORT="${POSTGRES_FUSIONAUTH_PORT}"
                  DB_NAME="${POSTGRES_FUSIONAUTH_DB}"
                  DB_USER="${POSTGRES_FUSIONAUTH_ROOT_USER}"
                  export PGPASSWORD="${POSTGRES_FUSIONAUTH_ROOT_PASSWORD}"

                  echo "[$(date)] Starting maintenance on ${DB_NAME} at ${DB_HOST}..."

                  echo "[$(date)] Running VACUUM ANALYZE..."
                  psql -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}" \
                    -c "VACUUM (VERBOSE, ANALYZE);" 2>&1

                  echo "[$(date)] Running REINDEX..."
                  psql -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}" \
                    -c "REINDEX DATABASE ${DB_NAME};" 2>&1

                  echo "[$(date)] Top 10 tables by size:"
                  psql -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}" -c "
                    SELECT schemaname || '.' || tablename AS tabla,
                           pg_size_pretty(pg_total_relation_size(schemaname || '.' || tablename)) AS size
                    FROM pg_tables
                    WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
                    ORDER BY pg_total_relation_size(schemaname || '.' || tablename) DESC
                    LIMIT 10;
                  "

                  echo "[$(date)] Low-usage indexes:"
                  psql -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}" -c "
                    SELECT schemaname || '.' || relname AS table_name,
                           indexrelname AS index_name,
                           idx_scan AS scans
                    FROM pg_stat_user_indexes
                    WHERE idx_scan < 10
                    ORDER BY idx_scan ASC
                    LIMIT 10;
                  "

                  echo "[$(date)] Maintenance completed"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi