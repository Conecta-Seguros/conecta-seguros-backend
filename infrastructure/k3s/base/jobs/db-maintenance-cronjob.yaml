apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-maintenance
  labels:
    app.kubernetes.io/name: postgres-maintenance
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/part-of: caicedo-seguros
    app.kubernetes.io/managed-by: kustomize
    caicedo.seguros/tier: infrastructure
spec:
  schedule: "0 4 * * 0"
  timeZone: "America/Bogota"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-maintenance
        app.kubernetes.io/component: maintenance
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-maintenance
            app.kubernetes.io/component: maintenance
        spec:
          restartPolicy: OnFailure
          serviceAccountName: job-runner
          automountServiceAccountToken: false
          priorityClassName: batch-low
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: pg-maintenance
              image: postgres:18
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi

              env:
                - name: PG_HOST
                  value: "postgresql-svc"
                - name: PG_PORT
                  value: "5432"
                - name: PG_USER
                  valueFrom:
                    secretKeyRef:
                      name: caicedo-seguros-secrets
                      key: POSTGRES_ROOT_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: caicedo-seguros-secrets
                      key: POSTGRES_ROOT_PASSWORD
                - name: POSTGRES_FUSIONAUTH_DB
                  valueFrom:
                    secretKeyRef:
                      name: caicedo-seguros-secrets
                      key: POSTGRES_FUSIONAUTH_DB
                - name: POSTGRES_GRAFANA_DB
                  valueFrom:
                    secretKeyRef:
                      name: caicedo-seguros-secrets
                      key: POSTGRES_GRAFANA_DB

              command:
                - /bin/sh
                - -ec
                - |
                  DATABASES="${POSTGRES_FUSIONAUTH_DB} ${POSTGRES_GRAFANA_DB}"

                  echo "=========================================="
                  echo "[$(date)] Starting multi-database maintenance"
                  echo "  Host: ${PG_HOST}:${PG_PORT}"
                  echo "  Databases: ${DATABASES}"
                  echo "=========================================="

                  for DB_NAME in ${DATABASES}; do
                    [ -z "$DB_NAME" ] && continue
                    echo ""
                    echo "=== Maintaining: ${DB_NAME} ==="

                    echo "[$(date)] VACUUM ANALYZE..."
                    psql -h "${PG_HOST}" -p "${PG_PORT}" -U "${PG_USER}" -d "${DB_NAME}" \
                      -c "VACUUM (VERBOSE, ANALYZE);" 2>&1

                    echo "[$(date)] REINDEX..."
                    psql -h "${PG_HOST}" -p "${PG_PORT}" -U "${PG_USER}" -d "${DB_NAME}" \
                      -c "REINDEX DATABASE \"${DB_NAME}\";" 2>&1

                    echo "[$(date)] Top 10 tables by size:"
                    psql -h "${PG_HOST}" -p "${PG_PORT}" -U "${PG_USER}" -d "${DB_NAME}" -c "
                      SELECT schemaname || '.' || tablename AS table_name,
                             pg_size_pretty(pg_total_relation_size(schemaname || '.' || tablename)) AS size
                      FROM pg_tables
                      WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
                      ORDER BY pg_total_relation_size(schemaname || '.' || tablename) DESC
                      LIMIT 10;
                    "
                    echo "[$(date)] [OK] ${DB_NAME} done"
                  done

                  echo ""
                  echo "=== Global database sizes ==="
                  psql -h "${PG_HOST}" -p "${PG_PORT}" -U "${PG_USER}" -d postgres -c "
                    SELECT datname, pg_size_pretty(pg_database_size(datname)) AS size
                    FROM pg_database WHERE datistemplate = false
                    ORDER BY pg_database_size(datname) DESC;
                  "
                  echo "[$(date)] All maintenance complete"

              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi