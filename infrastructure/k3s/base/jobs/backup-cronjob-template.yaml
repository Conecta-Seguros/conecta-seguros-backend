apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: data-management
    app.kubernetes.io/managed-by: kustomize
    conecta.seguros/tier: infrastructure
spec:
  schedule: "0 2 * * *"
  timeZone: "America/Bogota"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-backup
        app.kubernetes.io/component: backup
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/component: backup
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: job-runner
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-backup
              image: postgres:18
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              env:
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: develop-secrets
                      key: POSTGRES_FUSIONAUTH_BACKUP_URL
                - name: PGPORT
                  valueFrom:
                    configMapKeyRef:
                      name: backup-config
                      key: PGPORT
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: backup-config
                      key: PGDATABASE
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: PGUSER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: PGPASSWORD
                - name: BACKUP_RETENTION_DAYS
                  valueFrom:
                    configMapKeyRef:
                      name: backup-config
                      key: BACKUP_RETENTION_DAYS
              command:
                - /bin/sh
                - -ec
                - |
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/backups/${PGDATABASE}"
                  BACKUP_FILE="${BACKUP_DIR}/${PGDATABASE}_${TIMESTAMP}.sql.gz"

                  mkdir -p "${BACKUP_DIR}"
                  echo "[$(date)] Iniciando backup de ${PGDATABASE}..."

                  # Backup con compresión
                  pg_dump \
                    --format=custom \
                    --compress=9 \
                    --verbose \
                    --no-owner \
                    --no-privileges \
                    --file="${BACKUP_FILE}"

                  # Verificar integridad del backup
                  pg_restore --list "${BACKUP_FILE}" > /dev/null 2>&1
                  if [ $? -eq 0 ]; then
                    SIZE=$(du -h "${BACKUP_FILE}" | cut -f1)
                    echo "[$(date)] Backup exitoso: ${BACKUP_FILE} (${SIZE})"
                  else
                    echo "[$(date)] ERROR: Backup corrupto - ${BACKUP_FILE}"
                    rm -f "${BACKUP_FILE}"
                    exit 1
                  fi

                  # Limpiar backups antiguos
                  echo "[$(date)] Limpiando backups mayores a ${BACKUP_RETENTION_DAYS} días..."
                  find "${BACKUP_DIR}" -name "*.sql.gz" -mtime +${BACKUP_RETENTION_DAYS} -delete
                  REMAINING=$(find "${BACKUP_DIR}" -name "*.sql.gz" | wc -l)
                  echo "[$(date)] Backups restantes: ${REMAINING}"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-pvc
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi