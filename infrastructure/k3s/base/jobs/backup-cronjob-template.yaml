apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: data-management
    app.kubernetes.io/managed-by: kustomize
    conecta.seguros/tier: infrastructure
spec:
  schedule: "0 2 * * *"
  timeZone: "America/Bogota"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-backup
        app.kubernetes.io/component: backup
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/component: backup
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: job-runner
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-backup
              image: postgres:18
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              envFrom:
                - secretRef:
                    name: caicedo-seguros-secrets
              command:
                - /bin/sh
                - -ec
                - |
                  # Extract host from JDBC URL: jdbc:postgresql://host:port/db → host
                  DB_HOST=$(echo "${POSTGRES_FUSIONAUTH_BACKUP_URL}" | sed 's|jdbc:postgresql://||' | cut -d: -f1)
                  DB_PORT="${POSTGRES_FUSIONAUTH_BACKUP_PORT}"
                  DB_NAME="${POSTGRES_FUSIONAUTH_BACKUP_DB}"
                  DB_USER="${POSTGRES_FUSIONAUTH_BACKUP_ROOT_USER}"
                  RETENTION="${POSTGRES_FUSIONAUTH_BACKUP_RETENTION_DAYS}"

                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/backups/${DB_NAME}"
                  BACKUP_FILE="${BACKUP_DIR}/${DB_NAME}_${TIMESTAMP}.dump"

                  mkdir -p "${BACKUP_DIR}"
                  echo "[$(date)] Starting backup of ${DB_NAME} from ${DB_HOST}:${DB_PORT}..."

                  # pg_dump with explicit flags (PGPASSWORD of the env)
                  export PGPASSWORD="${POSTGRES_FUSIONAUTH_BACKUP_ROOT_PASSWORD}"
                  pg_dump \
                    -h "${DB_HOST}" \
                    -p "${DB_PORT}" \
                    -U "${DB_USER}" \
                    -d "${DB_NAME}" \
                    --format=custom \
                    --compress=9 \
                    --verbose \
                    --no-owner \
                    --no-privileges \
                    --file="${BACKUP_FILE}"

                  # Verify integrity
                  pg_restore --list "${BACKUP_FILE}" > /dev/null 2>&1
                  if [ $? -eq 0 ]; then
                    SIZE=$(du -h "${BACKUP_FILE}" | cut -f1)
                    echo "[$(date)] Backup successful: ${BACKUP_FILE} (${SIZE})"
                  else
                    echo "[$(date)] ERROR: Corrupt backup - ${BACKUP_FILE}"
                    rm -f "${BACKUP_FILE}"
                    exit 1
                  fi

                  # Clean old backups
                  echo "[$(date)] Cleaning backups older than ${RETENTION} days..."
                  find "${BACKUP_DIR}" -name "*.dump" -mtime +${RETENTION} -delete
                  REMAINING=$(find "${BACKUP_DIR}" -name "*.dump" | wc -l)
                  echo "[$(date)] Remaining backups: ${REMAINING}"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-pvc
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi