apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: caicedo-seguros
    app.kubernetes.io/managed-by: kustomize
    caicedo.seguros/tier: infrastructure
spec:
  schedule: "0 2 * * *"
  timeZone: "America/Bogota"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-backup
        app.kubernetes.io/component: backup
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: job-runner
          automountServiceAccountToken: false
          priorityClassName: batch-low
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: pg-backup
              image: postgres:18
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi

              env:
                - name: PG_HOST
                  value: "postgresql-svc"
                - name: PG_PORT
                  value: "5432"
                - name: PG_USER
                  valueFrom:
                    secretKeyRef:
                      name: caicedo-seguros-secrets
                      key: POSTGRES_ROOT_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: caicedo-seguros-secrets
                      key: POSTGRES_ROOT_PASSWORD
                - name: BACKUP_RETENTION_DAYS
                  valueFrom:
                    secretKeyRef:
                      name: caicedo-seguros-secrets
                      key: BACKUP_RETENTION_DAYS
                - name: POSTGRES_FUSIONAUTH_DB
                  valueFrom:
                    secretKeyRef:
                      name: caicedo-seguros-secrets
                      key: POSTGRES_FUSIONAUTH_DB
                - name: POSTGRES_GRAFANA_DB
                  valueFrom:
                    secretKeyRef:
                      name: caicedo-seguros-secrets
                      key: POSTGRES_GRAFANA_DB

              command:
                - /bin/sh
                - -ec
                - |
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  TOTAL=0
                  FAILED=0

                  DATABASES="${POSTGRES_FUSIONAUTH_DB} ${POSTGRES_GRAFANA_DB}"

                  echo "=========================================="
                  echo "[$(date)] Starting multi-database backup"
                  echo "  Host: ${PG_HOST}:${PG_PORT}"
                  echo "  Databases: ${DATABASES}"
                  echo "  Retention: ${BACKUP_RETENTION_DAYS} days"
                  echo "=========================================="

                  for DB_NAME in ${DATABASES}; do
                    [ -z "$DB_NAME" ] && continue
                    TOTAL=$((TOTAL + 1))
                    BACKUP_DIR="/backups/${DB_NAME}"
                    BACKUP_FILE="${BACKUP_DIR}/${DB_NAME}_${TIMESTAMP}.dump"
                    mkdir -p "${BACKUP_DIR}"

                    echo ""
                    echo "--- [${TOTAL}] Backing up: ${DB_NAME} ---"

                    if pg_dump \
                      -h "${PG_HOST}" \
                      -p "${PG_PORT}" \
                      -U "${PG_USER}" \
                      -d "${DB_NAME}" \
                      --format=custom \
                      --compress=9 \
                      --no-owner \
                      --no-privileges \
                      --file="${BACKUP_FILE}" 2>&1; then

                      if pg_restore --list "${BACKUP_FILE}" > /dev/null 2>&1; then
                        SIZE=$(du -h "${BACKUP_FILE}" | cut -f1)
                        echo "    [OK] ${BACKUP_FILE} (${SIZE})"
                      else
                        echo "    [ERROR] Corrupt backup: ${BACKUP_FILE}"
                        rm -f "${BACKUP_FILE}"
                        FAILED=$((FAILED + 1))
                      fi
                    else
                      echo "    [ERROR] pg_dump failed for ${DB_NAME}"
                      FAILED=$((FAILED + 1))
                    fi

                    find "${BACKUP_DIR}" -name "*.dump" -mtime "+${BACKUP_RETENTION_DAYS}" -delete
                  done

                  echo ""
                  echo "=========================================="
                  echo "[$(date)] Backup complete: ${TOTAL} total, $((TOTAL - FAILED)) ok, ${FAILED} failed"
                  echo "=========================================="
                  du -sh /backups/*/ 2>/dev/null || echo "  No backups found"

                  [ ${FAILED} -gt 0 ] && exit 1 || exit 0

              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp

          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-pvc
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi