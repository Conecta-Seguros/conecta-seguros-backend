apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  labels:
    app.kubernetes.io/name: db-migration
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: data-management
    app.kubernetes.io/managed-by: kustomize
    conecta.seguros/tier: infrastructure
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migration
        app.kubernetes.io/component: migration
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: job-runner
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: postgres:18
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: migration-config
                  key: PGHOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: migration-config
                  key: PGPORT
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: migration-credentials
                  key: PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: migration-credentials
                  key: PGPASSWORD
          command:
            - /bin/sh
            - -ec
            - |
              echo "[$(date)] Esperando conexión a PostgreSQL en ${PGHOST}:${PGPORT}..."
              RETRIES=30
              until pg_isready -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" || [ $RETRIES -eq 0 ]; do
                echo "[$(date)] Reintentando... (${RETRIES} intentos restantes)"
                RETRIES=$((RETRIES - 1))
                sleep 2
              done

              if [ $RETRIES -eq 0 ]; then
                echo "[$(date)] ERROR: PostgreSQL no disponible"
                exit 1
              fi
              echo "[$(date)] PostgreSQL disponible"
      containers:
        - name: flyway
          image: flyway/flyway:12.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 128Mi
          env:
            - name: FLYWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: migration-config
                  key: FLYWAY_URL
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: migration-credentials
                  key: PGUSER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: migration-credentials
                  key: PGPASSWORD
            - name: FLYWAY_SCHEMAS
              valueFrom:
                configMapKeyRef:
                  name: migration-config
                  key: FLYWAY_SCHEMAS
            - name: FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: FLYWAY_VALIDATE_ON_MIGRATE
              value: "true"
            - name: FLYWAY_OUT_OF_ORDER
              value: "false"
          args:
            - info
            - migrate
            - info
          volumeMounts:
            - name: sql-migrations
              mountPath: /flyway/sql
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: sql-migrations
          configMap:
            name: sql-migrations
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi