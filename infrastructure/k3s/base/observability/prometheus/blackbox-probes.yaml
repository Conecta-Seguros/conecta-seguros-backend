# ============================================================================
# blackbox-probes.yaml - BLACKBOX EXPORTER PROBES - BASE
# Monitoreo de endpoints HTTP/HTTPS internos y externos
# ============================================================================
# NO incluido en base/kustomization.yaml
# Solo test y production lo agregan como recurso adicional.
# ============================================================================

apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: internal-endpoints
  labels:
    app.kubernetes.io/name: internal-endpoints-probe
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: observability
    caicedo.seguros/tier: infrastructure
spec:
  interval: 30s
  scrapeTimeout: 10s
  module: http_2xx
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter:9115
  targets:
    staticConfig:
      static:
        - http://fusionauth-svc:9011/api/status
        - http://eureka-server-svc:8761/actuator/health
        - http://gateway-svc:8080/actuator/health
        - http://loki:3100/ready
      labels:
        probe_type: internal

---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: external-endpoints
  labels:
    app.kubernetes.io/name: external-endpoints-probe
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: observability
    caicedo.seguros/tier: infrastructure
spec:
  interval: 60s
  scrapeTimeout: 15s
  module: http_2xx
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter:9115
  targets:
    staticConfig:
      static:
        - https://caicedoseguros.com
        - https://api.caicedoseguros.com/actuator/health
        - https://auth.caicedoseguros.com
      labels:
        probe_type: external

---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ssl-certificate-check
  labels:
    app.kubernetes.io/name: ssl-certificate-probe
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: observability
    caicedo.seguros/tier: infrastructure
spec:
  interval: 300s
  scrapeTimeout: 15s
  module: http_2xx
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter:9115
  targets:
    staticConfig:
      static:
        - https://caicedoseguros.com
        - https://api.caicedoseguros.com
        - https://auth.caicedoseguros.com
        - https://grafana.caicedoseguros.com
      labels:
        probe_type: ssl_check