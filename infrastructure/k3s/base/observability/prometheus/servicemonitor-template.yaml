apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fusionauth
  labels:
    app.kubernetes.io/name: fusionauth
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: observability
    caicedo.seguros/tier: application
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fusionauth
  endpoints:
    - port: http
      path: /api/prometheus/metrics
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    any: true

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cadvisor
  labels:
    app.kubernetes.io/name: cadvisor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: observability
    caicedo.seguros/tier: infrastructure
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cadvisor
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "container_(network_tcp_usage_total|tasks_state|cpu_load_average_10s)"
          action: drop
  namespaceSelector:
    any: true

