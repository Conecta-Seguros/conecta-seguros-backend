apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: spring-boot-services
  labels:
    app.kubernetes.io/name: spring-boot-services
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: observability
    caicedo.seguros/tier: application
spec:
  selector:
    matchLabels:
      caicedo.seguros/metrics: "true"
  podMetricsEndpoints:
    - port: management
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: service
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_version]
          targetLabel: version
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "jvm_buffer_.*|process_files_.*|logback_events_total"
          action: drop
  namespaceSelector:
    any: true

---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nginx-ingress
  labels:
    app.kubernetes.io/name: nginx-ingress
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: observability
    caicedo.seguros/tier: infrastructure
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/component: controller
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - ingress-nginx