apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: log-collector
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/managed-by: kustomize
    caicedo.seguros/tier: infrastructure
data:
  promtail.yaml: |
    server:
      http_listen_port: 3101
      grpc_listen_port: 0
      log_level: info

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki-svc:3100/loki/api/v1/push
        tenant_id: caicedo-seguros
        batchwait: 1s
        batchsize: 1048576
        timeout: 10s
        backoff_config:
          min_period: 500ms
          max_period: 5m
          max_retries: 10
        external_labels:
          cluster: caicedo-seguros
          environment: ${ENVIRONMENT:-develop}

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_promtail_io_scrape]
            action: drop
            regex: "false"

          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container

          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app

          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component

          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

        pipeline_stages:
          - match:
              selector: '{app=~".+-service"}'
              stages:
                - json:
                    expressions:
                      level: level
                      message: message
                      logger: logger_name
                      thread: thread_name
                      trace_id: traceId
                      span_id: spanId
                - labels:
                    level:
                    trace_id:
                - timestamp:
                    source: timestamp
                    format: "2006-01-02T15:04:05.000Z"
                    fallback_formats:
                      - "2006-01-02 15:04:05.000"

          - match:
              selector: '{app="fusionauth"}'
              stages:
                - regex:
                    expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\.\d{3})\s+(?P<level>\w+)\s+.*'
                - labels:
                    level:
                - timestamp:
                    source: timestamp
                    format: "2006-01-02 15:04:05.000"

          - match:
              selector: '{app=~"postgresql.*"}'
              stages:
                - regex:
                    expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\.\d{3}\s\w+)\s\[(?P<pid>\d+)\]\s(?P<level>\w+):'
                - labels:
                    level:

          - match:
              selector: '{namespace=~".+"}'
              stages:
                - drop:
                    expression: '(GET /health|GET /actuator/health|GET /ready|GET /live)'
                    drop_counter_reason: health_check

          - match:
              selector: '{level=~"(ERROR|FATAL|CRITICAL)"}'
              stages:
                - labels:
                    severity: error
          - match:
              selector: '{level="WARN"}'
              stages:
                - labels:
                    severity: warning