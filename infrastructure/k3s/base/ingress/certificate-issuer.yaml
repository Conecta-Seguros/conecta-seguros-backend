# =============================================================
# Staging Issuer - For validation and non-productive environments
# =============================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/name: cert-manager-issuer
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: ingress-stack
    app.kubernetes.io/managed-by: kustomize
    caicedo.seguros/tier: infrastructure
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: caicedosegurosaxm@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    preferredChain: "ISRG Root X1"
    solvers:
      - http01:
          ingress:
            class: nginx
            podTemplate:
              metadata:
                labels:
                  app.kubernetes.io/name: acme-http-solver
                  app.kubernetes.io/component: tls-validation
              spec:
                priorityClassName: system-cluster-critical
                nodeSelector:
                  kubernetes.io/os: linux
---
# =============================================================
# Production Issuer - Certificates valid for production
# =============================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  labels:
    app.kubernetes.io/name: cert-manager-issuer
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: ingress-stack
    app.kubernetes.io/managed-by: kustomize
    caicedo.seguros/tier: infrastructure
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: caicedosegurosaxm@gmail.com
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    preferredChain: "ISRG Root X1"
    solvers:
      # DNS-01 solver for wildcard domains (*.caicedoseguros.com, *.api.caicedoseguros.com).
      # Requires a Kubernetes Secret named "cloudflare-api-token-secret" in the cert-manager
      # namespace with key "api-token" containing a Cloudflare API token that has the
      # Zone:DNS:Edit and Zone:Zone:Read permissions for the caicedoseguros.com zone.
      # Create it with:
      #   kubectl create secret generic cloudflare-api-token-secret \
      #     --from-literal=api-token=<YOUR_TOKEN> \
      #     -n cert-manager
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
        selector:
          dnsZones:
            - "caicedoseguros.com"
      # HTTP-01 solver for non-wildcard domains.
      - http01:
          ingress:
            class: nginx
            podTemplate:
              metadata:
                labels:
                  app.kubernetes.io/name: acme-http-solver
                  app.kubernetes.io/component: tls-validation
              spec:
                priorityClassName: system-cluster-critical
                nodeSelector:
                  kubernetes.io/os: linux