# =============================================================
# Staging Issuer - For validation and non-productive environments
# =============================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/name: cert-manager-issuer
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: ingress-stack
    app.kubernetes.io/managed-by: kustomize
    caicedo.seguros/tier: infrastructure
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: caicedosegurosaxm@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    preferredChain: "ISRG Root X1"
    solvers:
      - http01:
          ingress:
            class: nginx
            podTemplate:
              metadata:
                labels:
                  app.kubernetes.io/name: acme-http-solver
                  app.kubernetes.io/component: tls-validation
              spec:
                priorityClassName: system-cluster-critical
                nodeSelector:
                  kubernetes.io/os: linux
---
