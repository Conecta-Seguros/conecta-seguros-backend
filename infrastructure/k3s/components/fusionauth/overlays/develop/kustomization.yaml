apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: develop

labels:
  - pairs:
      caicedo.seguros/environment: develop

patches:
  - target:
      kind: Deployment
      name: fusionauth
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 2Gi
      - op: replace
        path: /spec/template/spec/initContainers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      - op: add
        path: /spec/template/spec/priorityClassName
        value: infrastructure-high

  - target:
      kind: Ingress
      name: fusionauth-ingress
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: auth-dev.caicedoseguros.com
      - op: replace
        path: /spec/tls/0/secretName
        value: caicedoseguros-tls-cert
      - op: replace
        path: /spec/rules/0/host
        value: auth-dev.caicedoseguros.com

  - target:
      kind: ServiceMonitor
      name: fusionauth
    patch: |
      - op: add
        path: /spec/namespaceSelector
        value:
          matchNames:
            - develop