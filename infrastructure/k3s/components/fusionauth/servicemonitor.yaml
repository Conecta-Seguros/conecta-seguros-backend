apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fusionauth
  namespace: production
  labels:
    app: fusionauth
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: fusionauth

  namespaceSelector:
    matchNames:
      - production

  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      scheme: http

      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace

      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'go_gc_.*'
          action: drop