apiVersion: apps/v1
kind: Deployment
metadata:
  name: fusionauth
  namespace: develop
  labels:
    app: fusionauth
    component: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fusionauth
      component: identity

  template:
    metadata:
      labels:
        app: fusionauth
        component: identity
    spec:

      initContainers:
        - name: wait-for-db
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z postgresql-svc.develop.svc.cluster.local 5432; do
                echo "PostgreSQL not ready, waiting..."
                sleep 2
              done
              echo "PostgreSQL is ready!"

      containers:
        - name: fusionauth
          image: fusionauth/fusionauth-app:1.62.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 9011
              protocol: TCP

          env:
            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: fusionauth-secrets

            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  key: DATABASE_USERNAME
                  name: fusionauth-secrets

            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DATABASE_PASSWORD
                  name: fusionauth-secrets

            - name: DATABASE_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  key: DATABASE_ROOT_USERNAME
                  name: fusionauth-secrets

            - name: DATABASE_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DATABASE_ROOT_PASSWORD
                  name: fusionauth-secrets

            # FusionAuth config
            - name: FUSIONAUTH_APP_MEMORY
              valueFrom:
                secretKeyRef:
                  key: FUSIONAUTH_APP_MEMORY
                  name: fusionauth-secrets

            - name: FUSIONAUTH_APP_RUNTIME_MODE
              valueFrom:
                secretKeyRef:
                  key: FUSIONAUTH_APP_RUNTIME_MODE
                  name: fusionauth-secrets

            - name: FUSIONAUTH_APP_URL
              valueFrom:
                secretKeyRef:
                  key: FUSIONAUTH_APP_URL
                  name: fusionauth-secrets

            - name: FUSIONAUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  key: FUSIONAUTH_API_KEY
                  name: fusionauth-secrets

            # Logging
            - name: FUSIONAUTH_APP_LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  key: FUSIONAUTH_APP_LOG_LEVEL
                  name: fusionauth-secrets

            - name: SEARCH_TYPE
              valueFrom:
                secretKeyRef:
                  key: SEARCH_TYPE
                  name: fusionauth-secrets

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          livenessProbe:
            httpGet:
              path: /api/status
              port: 9011
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /api/status
              port: 9011
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          startupProbe:
            httpGet:
              path: /api/status
              port: 9011
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60

---
apiVersion: v1
kind: Service
metadata:
  name: fusionauth-svc
  namespace: develop
  labels:
    app: fusionauth
spec:
  type: NodePort
  selector:
    app: fusionauth
  ports:
    - name: http
      port: 9011
      targetPort: 9011
      nodePort: 30011
      protocol: TCP