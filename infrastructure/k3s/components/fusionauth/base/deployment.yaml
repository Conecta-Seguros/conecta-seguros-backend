apiVersion: apps/v1
kind: Deployment
metadata:
  name: fusionauth
  labels:
    app.kubernetes.io/name: fusionauth
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: caicedo-seguros
    app.kubernetes.io/managed-by: kustomize
    caicedo.seguros/tier: application
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fusionauth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fusionauth
        app.kubernetes.io/component: identity
        app.kubernetes.io/part-of: caicedo-seguros
        caicedo.seguros/tier: application
        caicedo.seguros/metrics: "true"
    spec:
      serviceAccountName: fusionauth
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: wait-for-db
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z postgresql-svc 5432; do
                echo "PostgreSQL not ready, waiting..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

        - name: copy-jdk-security
          image: fusionauth/fusionauth-app:1.62.1
          command: ['sh', '-c', 'cp -rp /opt/openjdk/conf/security/. /jdk-security-rw/']
          volumeMounts:
            - name: jdk-security-rw
              mountPath: /jdk-security-rw
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

      containers:
        - name: fusionauth
          image: fusionauth/fusionauth-app:1.62.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9011
              protocol: TCP

          env:
            # === Database ===
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: caicedo-seguros-secrets
                  key: POSTGRES_FUSIONAUTH_URL
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: caicedo-seguros-secrets
                  key: POSTGRES_FUSIONAUTH_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caicedo-seguros-secrets
                  key: POSTGRES_FUSIONAUTH_PASSWORD
            - name: DATABASE_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: caicedo-seguros-secrets
                  key: POSTGRES_ROOT_USER
            - name: DATABASE_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caicedo-seguros-secrets
                  key: POSTGRES_ROOT_PASSWORD

            # === FusionAuth App Config ===
            - name: FUSIONAUTH_APP_MEMORY
              valueFrom:
                secretKeyRef:
                  name: caicedo-seguros-secrets
                  key: FUSIONAUTH_APP_MEMORY
            - name: FUSIONAUTH_APP_RUNTIME_MODE
              valueFrom:
                secretKeyRef:
                  name: caicedo-seguros-secrets
                  key: FUSIONAUTH_APP_RUNTIME_MODE
            - name: FUSIONAUTH_APP_URL
              valueFrom:
                secretKeyRef:
                  name: caicedo-seguros-secrets
                  key: FUSIONAUTH_APP_URL
            - name: FUSIONAUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: caicedo-seguros-secrets
                  key: FUSIONAUTH_API_KEY
            - name: FUSIONAUTH_APP_LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: caicedo-seguros-secrets
                  key: FUSIONAUTH_APP_LOG_LEVEL

            # === Kickstart ===
            - name: FUSIONAUTH_APP_KICKSTART_FILE
              value: "/kickstart/kickstart.json"
            - name: FUSIONAUTH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caicedo-seguros-secrets
                  key: FUSIONAUTH_ADMIN_PASSWORD
            - name: FUSIONAUTH_APPLICATION_ID
              valueFrom:
                secretKeyRef:
                  name: caicedo-seguros-secrets
                  key: FUSIONAUTH_APPLICATION_ID

            # === Search ===
            - name: SEARCH_TYPE
              valueFrom:
                secretKeyRef:
                  name: caicedo-seguros-secrets
                  key: FUSIONAUTH_APP_SEARCH_TYPE

          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"

          startupProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: kickstart
              mountPath: /kickstart
              readOnly: true
            - name: fusionauth-data
              mountPath: /usr/local/fusionauth/data
            - name: fusionauth-logs
              mountPath: /usr/local/fusionauth/logs
            - name: jdk-security-rw
              mountPath: /opt/openjdk/conf/security
            - name: fusionauth-java
              mountPath: /usr/local/fusionauth/java

      volumes:
        - name: kickstart
          configMap:
            name: fusionauth-kickstart
        - name: fusionauth-data
          emptyDir:
            sizeLimit: 512Mi
        - name: fusionauth-logs
          emptyDir:
            sizeLimit: 256Mi
        - name: jdk-security-rw
          emptyDir:
            sizeLimit: 32Mi
        - name: fusionauth-java
          emptyDir:
            sizeLimit: 512Mi