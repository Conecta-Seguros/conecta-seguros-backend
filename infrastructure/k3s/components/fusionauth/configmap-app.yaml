apiVersion: v1
kind: ConfigMap
metadata:
  name: fusionauth-config
  namespace: production
  labels:
    app: fusionauth
data:
  DATABASE_URL: "jdbc:postgresql://postgresql-svc.production.svc.cluster.local:5432/fusionauth"
  DATABASE_USERNAME: "fusionauth"
  DATABASE_ROOT_USERNAME: "postgres"

  FUSIONAUTH_APP_MEMORY: "1024M"
  FUSIONAUTH_APP_RUNTIME_MODE: "production"
  FUSIONAUTH_APP_URL: "https://auth.caicedoseguros.com"

  FUSIONAUTH_APP_EMAIL_HOST: "smtp.caicedoseguros.com"
  FUSIONAUTH_APP_EMAIL_PORT: "587"
  FUSIONAUTH_APP_EMAIL_SECURITY: "TLS"

  FUSIONAUTH_APP_LOG_LEVEL: "INFO"

  FUSIONAUTH_APP_ENABLE_AUDIT_LOG: "true"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fusionauth-kickstart
  namespace: production
  labels:
    app: fusionauth
data:
  kickstart.json: |
    {
      "variables": {
        "defaultTenantId": "d7d09513-a3f5-401c-9685-34ab6c552453",
        "adminEmail": "caicedosegurosaxm@gmail.com"
      },
      "apiKeys": [
        {
          "key": "#{FUSIONAUTH_API_KEY}",
          "description": "Core API Key"
        }
      ],
      "requests": [
        {
          "method": "POST",
          "url": "/api/user/registration",
          "body": {
            "user": {
              "email": "#{adminEmail}",
              "password": "#{FUSIONAUTH_ADMIN_PASSWORD}"
            },
            "registration": {
              "applicationId": "#{FUSIONAUTH_APPLICATION_ID}",
              "roles": ["admin"]
            }
          }
        }
      ]
    }