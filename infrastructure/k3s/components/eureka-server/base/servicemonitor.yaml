apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: eureka-server
  labels:
    app.kubernetes.io/name: eureka-server
    app.kubernetes.io/component: service-discovery
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: eureka-server
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
      basicAuth:
        username:
          name: caicedo-seguros-secrets
          key: EUREKA_USERNAME
        password:
          name: caicedo-seguros-secrets
          key: EUREKA_PASSWORD