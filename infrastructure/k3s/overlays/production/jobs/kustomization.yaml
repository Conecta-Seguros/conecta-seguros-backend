apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/jobs

labels:
  - pairs:
      conecta.seguros/environment: production

patches:
  - target:
      kind: CronJob
      name: postgres-backup
    patch: |
      - op: replace
        path: /spec/schedule
        value: "0 */6 * * *"
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"

  - target:
      kind: CronJob
      name: postgres-maintenance
    patch: |
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"

  - target:
      kind: Job
      name: db-migration
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/activeDeadlineSeconds
        value: 1800
      - op: replace
        path: /spec/template/spec/containers/0/env/5/value
        value: "false"

  - target:
      kind: PersistentVolumeClaim
      name: backup-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 20Gi

  - target:
      kind: ConfigMap
      name: backup-config
    patch: |
      - op: replace
        path: /data/PGHOST
        value: "postgresql-prod"
      - op: replace
        path: /data/PGDATABASE
        value: "conecta_seguros"
      - op: replace
        path: /data/BACKUP_RETENTION_DAYS
        value: "30"
  - target:
      kind: ConfigMap
      name: migration-config
    patch: |
      - op: replace
        path: /data/PGHOST
        value: "postgresql-prod"
      - op: replace
        path: /data/FLYWAY_URL
        value: "jdbc:postgresql://postgresql-prod:5432/conecta_seguros"
  - target:
      kind: ConfigMap
      name: cleanup-config
    patch: |
      - op: replace
        path: /data/TARGET_NAMESPACES
        value: "conecta-seguros ingress-nginx monitoring"