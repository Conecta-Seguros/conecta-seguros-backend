apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/observability
  - ../../../base/observability/prometheus/blackbox-probes.yaml

namespace: production

labels:
  - pairs:
      caicedo.seguros/environment: production

patches:
  - target:
      kind: DaemonSet
      name: promtail
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "300m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

  - target:
      kind: ConfigMap
      name: promtail-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: promtail-config
      data:
        promtail.yaml: |
          server:
            http_listen_port: 3101
            grpc_listen_port: 0
            log_level: warn

          positions:
            filename: /run/promtail/positions.yaml

          clients:
            - url: http://loki-svc.production.svc.cluster.local:3100/loki/api/v1/push
              tenant_id: caicedo-seguros
              batchwait: 1s
              batchsize: 2097152
              timeout: 15s
              backoff_config:
                min_period: 500ms
                max_period: 5m
                max_retries: 15
              external_labels:
                cluster: caicedo-seguros
                environment: production

          scrape_configs:
            - job_name: kubernetes-pods
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_promtail_io_scrape]
                  action: drop
                  regex: "false"
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  target_label: app
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
                  target_label: component
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
              pipeline_stages:
                - match:
                    selector: '{app=~".+-service"}'
                    stages:
                      - json:
                          expressions:
                            level: level
                            message: message
                            logger: logger_name
                            thread: thread_name
                            trace_id: traceId
                            span_id: spanId
                      - labels:
                          level:
                          trace_id:
                      - timestamp:
                          source: timestamp
                          format: "2006-01-02T15:04:05.000Z"
                          fallback_formats:
                            - "2006-01-02 15:04:05.000"
                - match:
                    selector: '{app="fusionauth"}'
                    stages:
                      - regex:
                          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\.\d{3})\s+(?P<level>\w+)\s+.*'
                      - labels:
                          level:
                      - timestamp:
                          source: timestamp
                          format: "2006-01-02 15:04:05.000"
                - match:
                    selector: '{app=~"postgresql.*"}'
                    stages:
                      - regex:
                          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\.\d{3}\s\w+)\s\[(?P<pid>\d+)\]\s(?P<level>\w+):'
                      - labels:
                          level:
                - match:
                    selector: '{namespace=~".+"}'
                    stages:
                      - drop:
                          expression: '(GET /health|GET /actuator/health|GET /ready|GET /live)'
                          drop_counter_reason: health_check
                - match:
                    selector: '{level=~"(ERROR|FATAL|CRITICAL)"}'
                    stages:
                      - labels:
                          severity: error
                - match:
                    selector: '{level="WARN"}'
                    stages:
                      - labels:
                          severity: warning

  - target:
      kind: ServiceMonitor
      name: fusionauth
    patch: |
      - op: replace
        path: /spec/endpoints/0/interval
        value: "15s"
  - target:
      kind: ServiceMonitor
      name: postgres-exporter
    patch: |
      - op: replace
        path: /spec/endpoints/0/interval
        value: "15s"
  - target:
      kind: PodMonitor
      name: spring-boot-services
    patch: |
      - op: replace
        path: /spec/podMetricsEndpoints/0/interval
        value: "15s"