apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-resources
  namespace: production
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 20Gi
    limits.cpu: "12"
    limits.memory: 28Gi

    persistentvolumeclaims: "10"
    services.loadbalancers: "0"
    count/deployments.apps: "20"
    count/statefulsets.apps: "5"