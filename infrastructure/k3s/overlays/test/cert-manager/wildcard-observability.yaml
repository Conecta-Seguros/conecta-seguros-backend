# =============================================================
# Wildcard Certificate — observability namespace
# Covers: *.test.caicedoseguros.com (internal routing)
# NOTE: Public hostnames grafana-test and kite-test.caicedoseguros.com
#       are covered by Cloudflare Universal SSL (*.caicedoseguros.com).
#       This cert is kept for internal cluster TLS if needed.
#          (secretName: wildcard-test-observability-tls)
# =============================================================
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-test-observability-tls
  namespace: observability
  labels:
    app.kubernetes.io/name: wildcard-test-observability-tls
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: ingress-stack
    app.kubernetes.io/managed-by: kustomize
    caicedo.seguros/tier: infrastructure
    caicedo.seguros/environment: test
spec:
  secretName: wildcard-test-observability-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  renewBefore: 720h
  duration: 2160h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - "test.caicedoseguros.com"
    - "*.test.caicedoseguros.com"
  usages:
    - digital signature
    - key encipherment
    - server auth
  revisionHistoryLimit: 3
