apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/observability
  - ../../../base/observability/prometheus/blackbox-probes.yaml

namespace: test

labels:
  - pairs:
      caicedo.seguros/environment: test

patches:
  - target:
      kind: Probe
      name: external-endpoints
    patch: |
      apiVersion: monitoring.coreos.com/v1
      kind: Probe
      metadata:
        name: external-endpoints
      spec:
        targets:
          staticConfig:
            static:
              - https://test.caicedoseguros.com
            labels:
              probe_type: external

  - target:
      kind: Probe
      name: ssl-certificate-check
    patch: |
      apiVersion: monitoring.coreos.com/v1
      kind: Probe
      metadata:
        name: ssl-certificate-check
      spec:
        targets:
          staticConfig:
            static:
              - https://test.caicedoseguros.com
            labels:
              probe_type: ssl_check

  - target:
      kind: ConfigMap
      name: promtail-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: promtail-config
      data:
        promtail.yaml: |
          server:
            http_listen_port: 3101
            grpc_listen_port: 0
            log_level: info

          positions:
            filename: /run/promtail/positions.yaml

          clients:
            - url: http://loki-svc.test.svc.cluster.local:3100/loki/api/v1/push
              tenant_id: caicedo-seguros
              batchwait: 1s
              batchsize: 1048576
              timeout: 10s
              backoff_config:
                min_period: 500ms
                max_period: 5m
                max_retries: 10
              external_labels:
                cluster: caicedo-seguros
                environment: test

          scrape_configs:
            - job_name: kubernetes-pods
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_promtail_io_scrape]
                  action: drop
                  regex: "false"
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  target_label: app
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
                  target_label: component
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
              pipeline_stages:
                - match:
                    selector: '{app=~".+-service"}'
                    stages:
                      - json:
                          expressions:
                            level: level
                            message: message
                            logger: logger_name
                            thread: thread_name
                            trace_id: traceId
                            span_id: spanId
                      - labels:
                          level:
                          trace_id:
                - match:
                    selector: '{app="fusionauth"}'
                    stages:
                      - regex:
                          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\.\d{3})\s+(?P<level>\w+)\s+.*'
                      - labels:
                          level:
                - match:
                    selector: '{namespace=~".+"}'
                    stages:
                      - drop:
                          expression: '(GET /health|GET /actuator/health|GET /ready|GET /live)'
                          drop_counter_reason: health_check