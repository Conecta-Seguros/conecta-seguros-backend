# Kite test environment overrides
# Adds ingress for external access at kite.test.caicedoseguros.com

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: kite.test.caicedoseguros.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: kite-test-tls
      hosts:
        - kite.test.caicedoseguros.com

host: "https://kite.test.caicedoseguros.com"
