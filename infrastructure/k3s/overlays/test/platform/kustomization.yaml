apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/platform/namespace-scoped
  - ../../../base/platform/network-policies/deny-all-egress.yaml

namespace: test

labels:
  - pairs:
      conecta.seguros/environment: test

patches:
  - target:
      kind: ResourceQuota
      name: compute-resources
    patch: |
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: compute-resources
      spec:
        hard:
          requests.cpu: "4"
          requests.memory: 8Gi
          limits.cpu: "8"
          limits.memory: 16Gi
          persistentvolumeclaims: "10"
          services.loadbalancers: "1"
          count/deployments.apps: "15"
          count/statefulsets.apps: "5"
          count/jobs.batch: "10"
          count/cronjobs.batch: "5"