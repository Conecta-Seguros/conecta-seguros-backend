apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/jobs

labels:
  - pairs:
      conecta.seguros/environment: test

patches:
  - target:
      kind: CronJob
      name: postgres-backup
    patch: |
      - op: replace
        path: /spec/schedule
        value: "0 3 * * *"

  - target:
      kind: CronJob
      name: postgres-maintenance
    patch: |
      - op: replace
        path: /spec/schedule
        value: "0 4 1,15 * *"

  - target:
      kind: PersistentVolumeClaim
      name: backup-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 3Gi

  - target:
      kind: ConfigMap
      name: backup-config
    patch: |
      - op: replace
        path: /data/PGHOST
        value: "postgresql-test"
      - op: replace
        path: /data/PGDATABASE
        value: "conecta_seguros_test"
      - op: replace
        path: /data/BACKUP_RETENTION_DAYS
        value: "5"
  - target:
      kind: ConfigMap
      name: migration-config
    patch: |
      - op: replace
        path: /data/PGHOST
        value: "postgresql-test"
      - op: replace
        path: /data/FLYWAY_URL
        value: "jdbc:postgresql://postgresql-test:5432/conecta_seguros_test"
  - target:
      kind: ConfigMap
      name: cleanup-config
    patch: |
      - op: replace
        path: /data/TARGET_NAMESPACES
        value: "conecta-seguros-test"