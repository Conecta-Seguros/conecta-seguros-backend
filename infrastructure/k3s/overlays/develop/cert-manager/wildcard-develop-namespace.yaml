# =============================================================
# Wildcard Certificate — develop namespace
# Covers: *.develop.caicedoseguros.com
# Used by: all ingress resources in develop namespace
#          (secretName: wildcard-develop-tls)
# =============================================================
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-develop-tls
  namespace: develop
  labels:
    app.kubernetes.io/name: wildcard-develop-tls
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: ingress-stack
    app.kubernetes.io/managed-by: kustomize
    caicedo.seguros/tier: infrastructure
    caicedo.seguros/environment: develop
spec:
  secretName: wildcard-develop-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  renewBefore: 720h
  duration: 2160h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - "develop.caicedoseguros.com"
    - "*.develop.caicedoseguros.com"
  usages:
    - digital signature
    - key encipherment
    - server auth
  revisionHistoryLimit: 3
