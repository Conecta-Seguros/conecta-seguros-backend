services:

  clients_db:
    image: postgres:latest
    container_name: clients_db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: clients_db
    ports:
      - "5434:5432"
    volumes:
      - clients_db_data:/var/lib/postgresql/data
      - ./init-scripts/clients_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - conecta_seguros_network

  products_db:
    image: postgres:latest
    container_name: products_db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: products_db
    ports:
      - "5435:5432"
    volumes:
      - products_db_data:/var/lib/postgresql/data
      - ./init-scripts/products_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - conecta_seguros_network

  payments_db:
    image: postgres:latest
    container_name: payments_db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: payments_db
    ports:
      - "5436:5432"
    volumes:
      - payments_db_data:/var/lib/postgresql/data
      - ./init-scripts/payments_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - conecta_seguros_network

  news_db:
    image: postgres:latest
    container_name: news_db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: news_db
    ports:
      - "5437:5432"
    volumes:
      - news_db_data:/var/lib/postgresql/data
      - ./init-scripts/news_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - conecta_seguros_network

  reports_db:
    image: postgres:latest
    container_name: reports_db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: reports_db
    ports:
      - "5438:5432"
    volumes:
      - reports_db_data:/var/lib/postgresql/data
      - ./init-scripts/reports_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - conecta_seguros_network

  keycloak_db:
    image: postgres:latest
    container_name: keycloak_db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: keycloak_db
    ports:
      - "5439:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - conecta_seguros_network

  redis_cache:
    image: redis:latest
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - conecta_seguros_network
    volumes:
      - redis_cache_data:/data
    command: redis-server --appendonly no

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: [ "start-dev" ]
    ports:
      - "8181:8181"
    expose:
      - "8181"
    depends_on:
      - keycloak_db
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: ${DB_USERNAME}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8181
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false

    networks:
      - conecta_seguros_network

volumes:
  clients_db_data:
    driver: local
  products_db_data:
    driver: local
  payments_db_data:
    driver: local
  news_db_data:
    driver: local
  reports_db_data:
    driver: local
  keycloak_db_data:
    driver: local
  redis_cache_data:
    driver: local

networks:
  conecta_seguros_network:
    driver: bridge